name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ai_runtime
          POSTGRES_PASSWORD: ai_runtime
          POSTGRES_DB: ai_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_runtime -d ai_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify editable import path
        run: python -c "import ai_runtime; from pathlib import Path; assert 'src' in Path(ai_runtime.__file__).parts"

      - name: Run unit tests
        env:
          AI_RUNTIME_DATABASE_URL: postgresql+asyncpg://ai_runtime:ai_runtime@localhost:5432/ai_runtime
        run: pytest

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy
